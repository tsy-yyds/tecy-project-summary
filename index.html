<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECY 项目总汇 · tsy-yyds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d1d1f'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h8' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  color:#1d1d1f;background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 28px}

header{text-align:center;padding:96px 0 54px}
h1{font-size:44px;font-weight:700;letter-spacing:-.02em}
.tagline{margin-top:14px;font-size:17px;color:#86868b}

main{padding:6px 0 30px}
.app{border-top:1px solid #d2d2d7}
a.row{
  display:flex;align-items:center;gap:18px;padding:26px 4px;text-decoration:none;color:#1d1d1f;
  transition:background .15s
}
a.row:hover{background:#f5f5f7}
.row .info{flex:1;min-width:0}
.row .name{font-size:20px;font-weight:600;letter-spacing:-.01em}
.row .desc{color:#86868b;font-size:14.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ver{flex:none;font-size:12.5px;color:#86868b;border:1px solid #d2d2d7;border-radius:999px;padding:2px 12px}
.row .arr{flex:none;color:#0071e3;font-size:20px;line-height:1}
a.row:hover .arr{transform:translateX(3px)}
.arr{transition:transform .15s}

footer{padding:52px 0 72px;border-top:1px solid #d2d2d7;margin-top:40px;color:#86868b;font-size:13px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
footer a{color:#1d1d1f;text-decoration:none}
footer a:hover{text-decoration:underline}

@media (max-width:560px){
  header{padding:64px 0 40px}
  h1{font-size:34px}
  .tagline{font-size:15px}
  .row .name{font-size:17px}
  .row .desc{white-space:normal}
}
</style>
</head>
<body>

<header class="wrap">
  <h1>TECY 项目总汇</h1>
  <p class="tagline">个人开发的应用 · 全部开源 · 每个应用都有官网</p>
</header>

<main class="wrap" id="apps"></main>

<footer class="wrap">
  <div>© 2026 tsy-yyds · TECY 项目总汇</div>
  <div><a href="https://github.com/tsy-yyds" target="_blank" rel="noopener">GitHub 主页</a></div>
</footer>

<script>
var APPS = [
  {name:"共享打印 · Web Print Server", desc:"USB 打印机秒变网络打印机，手机电脑都能打", ver:"v2.0", url:"https://tsy-yyds.github.io/webprint-server/"},
  {name:"悬浮便签 · DeskNote", desc:"常驻桌面、开机自启的悬浮便签，随时记录随时看", ver:"v1.0", url:"https://tsy-yyds.github.io/desknote/"},
  {name:"多功能实用工具箱", desc:"十余个工具一站式打包：下载、PDF、重命名、番茄钟……", ver:"v3.0", url:"https://tsy-yyds.github.io/tecy-toolbox/"},
  {name:"GPS 定位 HTML 前端", desc:"浏览器定位互动页 + 密文解密，纯网页小工具", ver:"在线", url:"https://tsy-yyds.github.io/gps-html/"},
  {name:"HorrorEscape 恐怖逃脱", desc:"Windows 恐怖逃脱游戏", ver:"v1.0.1", url:"https://horrorescape-tsy.pages.dev/"}
];

var box=document.getElementById('apps');
APPS.forEach(function(a){
  var s=document.createElement('section');
  s.className='app';
  s.innerHTML='<a class="row" href="'+a.url+'" target="_blank" rel="noopener">'+
    '<div class="info"><div class="name">'+a.name+'</div><div class="desc">'+a.desc+'</div></div>'+
    '<span class="ver">'+a.ver+'</span><span class="arr" aria-hidden="true">→</span></a>';
  box.appendChild(s);
});
</script>
</body>
</html>
