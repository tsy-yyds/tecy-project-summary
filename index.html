<title>TECY 项目总汇 · tsy-yyds</title>

<style>
:root{
  --bg0:#080e1e; --bg1:#0d1730; --card:#111c36; --card2:#0e1830;
  --line:#1e2c4a; --txt:#e7eefb; --sub:#9db0d0; --dim:#6b7ea0;
  --blue:#3b82f6; --cyan:#38bdf8; --green:#34d399; --amber:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(1200px 600px at 80% -10%, #132650 0%, transparent 60%),
             radial-gradient(900px 500px at -10% 20%, #0f2347 0%, transparent 55%),
             linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
  color:var(--txt);
  font-family:"Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}

/* hero */
.hero{padding:56px 0 30px;text-align:center}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;letter-spacing:.18em;color:var(--cyan);
  border:1px solid #24406b;border-radius:999px;padding:6px 16px;margin-bottom:18px;
  background:rgba(56,189,248,.06)
}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:900;letter-spacing:.02em;line-height:1.15}
.hero h1 span{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:var(--sub);margin-top:12px;font-size:15px}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
.stat{
  flex:1 1 130px;max-width:200px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 10px;text-align:center
}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--cyan)}
.stat span{font-size:12.5px;color:var(--sub)}

/* sections */
.sec{margin:34px 0 12px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
.sec .hint{font-size:12px;font-weight:400;color:var(--dim)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:22px;box-shadow:0 10px 30px rgba(2,8,26,.35)}
.card-head{display:flex;align-items:flex-start;gap:14px}
.ico{
  flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1b3a6b,#0f2444);border:1px solid #2a4a80
}
.ico svg{width:24px;height:24px;stroke:var(--cyan)}
.card-head h3{font-size:19px;font-weight:700}
.badges{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--sub);background:#0d1a33}
.badge.ver{color:#091224;background:var(--cyan);border-color:var(--cyan);font-weight:600}
.desc{margin:12px 0;font-size:14px;color:var(--sub)}
.feats{margin:10px 0 14px;display:flex;flex-wrap:wrap;gap:6px}
.feat{font-size:12px;color:#c6d5ee;background:#152348;border:1px solid #223660;border-radius:999px;padding:3px 11px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.btn{
  display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:10px;border:1px solid #2a4a80;color:#cfe3ff;background:#13264a;
  transition:all .15s
}
.btn:hover{background:#1a3564;border-color:#3a63a8;text-decoration:none;transform:translateY(-1px)}
.btn.dl{background:linear-gradient(90deg,var(--blue),#2f6bdc);border-color:transparent;color:#fff}
.btn.dl:hover{filter:brightness(1.12)}
.btn svg{width:15px;height:15px}
.btn.site{background:#13264a}

/* file table */
.ft{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.ft th{color:var(--dim);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:12px}
.ft td{padding:8px;border-bottom:1px solid #16233f;color:var(--txt)}
.ft tr:last-child td{border-bottom:none}
.ft td:first-child{width:58%;word-break:break-all}
.ft td:nth-child(2){width:14%;color:var(--sub)}
.ft td:last-child{width:28%;text-align:right}
.ft a.dl2{
  display:inline-block;font-size:12px;font-weight:600;color:#fff;
  background:var(--blue);padding:5px 12px;border-radius:8px
}
.ft a.dl2:hover{filter:brightness(1.15);text-decoration:none}
.note{margin-top:10px;font-size:12px;color:var(--dim)}

/* timeline */
.tl{position:relative;margin:18px 0 6px;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
.tl-item{position:relative;padding:0 0 20px 16px}
.tl-item::before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--cyan);border:2px solid #0d1730;box-shadow:0 0 0 2px #1b3a6b;box-sizing:border-box}
.tl-item .t{font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.05em}
.tl-item .e{font-size:14px;margin-top:2px}
.tl-item .d{font-size:12.5px;color:var(--sub)}

/* footer */
.footer{margin-top:44px;padding:26px 0 40px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.footer a{color:var(--sub)}
@media (max-width:560px){
  .hero{padding:40px 0 22px}
  .ft td:first-child{width:52%}
  .ft td:nth-child(2){width:15%}
  .ft td:last-child{width:33%}
}
</style>

    );
    box.appendChild(card);
  });
}

function renderTimeline(){
  var box=document.getElementById('timeline');
  TIMELINE.forEach(function(i){
    var d=el('<div class="tl-item"><div class="t">'+i.t+'</div><div class="e">'+i.e+'</div><div class="d">'+i.d+'</div></div>');
    box.appendChild(d);
  });
}

renderStats();
renderCards();
renderTimeline();
</script>
